[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uds-mcp-server"
version = "0.1.0"
description = "MCP server for looking up UDS (ISO 14229) diagnostic services"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.setuptools]
packages = ["src"]
